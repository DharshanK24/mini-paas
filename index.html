<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mini PaaS Dashboard</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin-top: 50px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      background-color: green;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
    }

    button:hover {
      background-color: darkgreen;
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      display: inline-block;
      min-width: 100px;
    }
  </style>
</head>
<body>

  <h1>🚀 Mini PaaS Dashboard</h1>

  <button onclick="deploy()">Deploy App</button>
  <button onclick="viewLogs()">View Logs</button>
  <button onclick="checkStatus()">Check Status</button>

  <h3 id="status">Loading...</h3>

  <script>
    function checkStatus() {
      fetch('/status')
        .then(res => res.text())
        .then(data => {
          const statusElem = document.getElementById("status");
          statusElem.innerText = data;
          statusElem.style.backgroundColor = data.includes("Running") ? "green" : "red";
        })
        .catch(err => {
          const statusElem = document.getElementById("status");
          statusElem.innerText = "Error checking status ❌";
          statusElem.style.backgroundColor = "gray";
        });
    }

    function deploy() {
      fetch('/deploy')
        .then(res => res.text())
        .then(data => {
          const statusElem = document.getElementById("status");
          statusElem.innerText = data;
          statusElem.style.backgroundColor = "blue";
        })
        .catch(err => {
          const statusElem = document.getElementById("status");
          statusElem.innerText = "Error deploying app ❌";
          statusElem.style.backgroundColor = "gray";
        });
    }

    function viewLogs() {
      fetch('/logs')
        .then(res => res.text())
        .then(data => {
          const statusElem = document.getElementById("status");
          statusElem.innerText = data;
          statusElem.style.backgroundColor = "orange";
        })
        .catch(err => {
          const statusElem = document.getElementById("status");
          statusElem.innerText = "Error fetching logs ❌";
          statusElem.style.backgroundColor = "gray";
        });
    }

    // Auto-refresh every 5 seconds
    setInterval(checkStatus, 5000);
    checkStatus();
  </script>

</body>
</html>
